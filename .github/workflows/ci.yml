name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      # A container can't load kernel modules, so the runner loads k3s's.
      - run: sudo modprobe -a br_netfilter overlay
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # Rootless Podman doesn't hand containers the cpuset cgroup k3s needs.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Check the API answers, the login works and the local cluster is active
        working-directory: examples/local
        run: sudo podman exec -i circuit-rancher sh -s < check.sh
      # The k3s token and the bootstrap password are ephemeral and reach the
      # host write-only, so state holds neither of them, and nothing Conn3x
      # writes under .terraform does either.
      - name: Check the token and bootstrap password stay out of state
        working-directory: examples/local
        run: |
          test -s terraform.tfstate || { echo "No terraform.tfstate to check." >&2; exit 1; }
          if grep -rqF --exclude-dir=modules -e example-token-change-me -e example-bootstrap-change-me terraform.tfstate .terraform/; then
            echo "The k3s token or the bootstrap password is in terraform.tfstate or under .terraform/." >&2
            exit 1
          fi
      # A fresh host gets Rancher 2.15.2, then the circuit's own pin is
      # applied over it, the way someone moves to a new release of this
      # circuit. Helm upgrades the release in place, and the login and the
      # local cluster have to come back on the new Rancher.
      - name: Upgrade from Rancher 2.15.2 on a fresh host, then plan again with no changes
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: |
          ./down.sh
          ./up.sh
          conn3x init
          conn3x apply -auto-approve -var rancher_version=2.15.2 \
            -var rancher_chart_sha256=855cb9be954f65a31b9a8c77f7aebce125c2d7797425257d21d35e3380816ac8
          image() { sudo podman exec circuit-rancher k3s kubectl -n cattle-system get deploy rancher -o jsonpath='{.spec.template.spec.containers[0].image}'; }
          image | grep -q ':v2.15.2$'
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          want=$(sed -n '/^variable "rancher_version"/,/^}/s/^ *default *= *"\(.*\)"/\1/p' ../../variables.tf)
          image | grep -q ":v$want\$"
      - name: Check the upgraded Rancher's API, login and local cluster
        working-directory: examples/local
        run: sudo podman exec -i circuit-rancher sh -s < check.sh
      - name: Show what's running
        if: failure()
        run: sudo podman exec circuit-rancher sh -c 'k3s kubectl get pods -A; k3s kubectl -n cattle-system logs deploy/rancher --tail=100; journalctl -u k3s --no-pager -n 100' || true
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
